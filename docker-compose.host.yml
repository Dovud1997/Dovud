# Host-network overlay for restricted VMs where Docker bridge routing fails.
# Usage:  sudo docker compose -f docker-compose.yml -f docker-compose.host.yml up --build -d
#
# All services share the host network namespace and talk via 127.0.0.1.

services:
  postgres:
    network_mode: host
    # With host networking, published ports are ignored; Postgres still binds :5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfa -d sfa -h 127.0.0.1"]

  redis:
    network_mode: host

  rabbitmq:
    network_mode: host

  minio:
    network_mode: host

  mailhog:
    network_mode: host

  api:
    network_mode: host
    environment:
      SFA_CONFIG: /app/configs/config.yaml
      SFA_DATABASE_DSN: "host=127.0.0.1 user=sfa password=sfa dbname=sfa port=5432 sslmode=disable TimeZone=UTC"
      SFA_REDIS_ADDR: 127.0.0.1:6379
      SFA_HTTP_ADDR: ":8080"
      SFA_RABBITMQ_URL: amqp://sfa:sfa@127.0.0.1:5672/
      SFA_MINIO_ENDPOINT: 127.0.0.1:9000
      SFA_STORAGE_DRIVER: minio
      SFA_PUBLIC_BASE_URL: http://localhost:8080
      SFA_CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started

  worker:
    network_mode: host
    environment:
      SFA_CONFIG: /app/configs/config.yaml
      SFA_DATABASE_DSN: "host=127.0.0.1 user=sfa password=sfa dbname=sfa port=5432 sslmode=disable TimeZone=UTC"
      SFA_RABBITMQ_URL: amqp://sfa:sfa@127.0.0.1:5672/
      SFA_MINIO_ENDPOINT: 127.0.0.1:9000
      SFA_STORAGE_DRIVER: minio
      SFA_EMAIL_DRIVER: smtp
      SFA_SMTP_HOST: 127.0.0.1
      SFA_SMTP_PORT: "1025"
      SFA_SMTP_FROM: noreply@sfa.local
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      mailhog:
        condition: service_started

  scheduler:
    network_mode: host
    environment:
      SFA_CONFIG: /app/configs/config.yaml
      SFA_DATABASE_DSN: "host=127.0.0.1 user=sfa password=sfa dbname=sfa port=5432 sslmode=disable TimeZone=UTC"
      SFA_RABBITMQ_URL: amqp://sfa:sfa@127.0.0.1:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  web:
    network_mode: host
    # nginx listens on 80 inside image; remap via command for host mode (80 may be busy).
    # Use a wrapper that listens on 3000.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -i 's/listen  *80;/listen 3000;/' /etc/nginx/conf.d/default.conf
        sed -i 's|proxy_pass http://api:8080/api/;|proxy_pass http://127.0.0.1:8080/api/;|g' /etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'
    depends_on:
      - api
