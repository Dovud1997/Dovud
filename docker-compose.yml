services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sfa
      POSTGRES_PASSWORD: sfa
      POSTGRES_DB: sfa
    ports:
      - "5432:5432"
    volumes:
      - sfa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfa -d sfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sfa
      RABBITMQ_DEFAULT_PASS: sfa
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sfa_minio:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.api
    environment:
      SFA_CONFIG: /app/configs/config.yaml
      SFA_DATABASE_DSN: "host=postgres user=sfa password=sfa dbname=sfa port=5432 sslmode=disable TimeZone=UTC"
      SFA_REDIS_ADDR: redis:6379
      SFA_HTTP_ADDR: ":8080"
      SFA_RABBITMQ_URL: amqp://sfa:sfa@rabbitmq:5672/
      SFA_MINIO_ENDPOINT: minio:9000
      SFA_STORAGE_DRIVER: minio
      SFA_PUBLIC_BASE_URL: http://localhost:8080
      SFA_CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.worker
    environment:
      SFA_CONFIG: /app/configs/config.yaml
      SFA_DATABASE_DSN: "host=postgres user=sfa password=sfa dbname=sfa port=5432 sslmode=disable TimeZone=UTC"
      SFA_RABBITMQ_URL: amqp://sfa:sfa@rabbitmq:5672/
      SFA_MINIO_ENDPOINT: minio:9000
      SFA_STORAGE_DRIVER: minio
      SFA_EMAIL_DRIVER: smtp
      SFA_SMTP_HOST: mailhog
      SFA_SMTP_PORT: "1025"
      SFA_SMTP_FROM: noreply@sfa.local
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      mailhog:
        condition: service_started

  scheduler:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.scheduler
    environment:
      SFA_CONFIG: /app/configs/config.yaml
      SFA_DATABASE_DSN: "host=postgres user=sfa password=sfa dbname=sfa port=5432 sslmode=disable TimeZone=UTC"
      SFA_RABBITMQ_URL: amqp://sfa:sfa@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sfa_pg:
  sfa_minio:
