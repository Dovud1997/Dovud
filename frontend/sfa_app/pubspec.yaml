name: sfa_app
description: Sales Force Automation — White Label Flutter client (Android, iOS, Web Admin)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  connectivity_plus: ^6.1.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  drift_flutter: 0.2.0 # pinned: 0.2.7+ needs newer drift than Flutter 3.24 stack

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
